<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toxic Bestie AI - Heartbreak Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pyidaungsu', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 h-screen flex flex-col justify-between">

    <!-- 1. Selection Screen (Modal / Initial View) -->
    <div id="setupScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-red-500 mb-2">🔥 Toxic Bestie AI</h1>
                <p class="text-xs text-slate-400">အသည်းကွဲလို့ လာငိုပြမယ့်သူ ဘယ်သူလဲ ရွေးလိုက်စမ်း...</p>
            </div>

            <!-- User Gender Selection -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-300">မင်းက ဘယ်သူလဲ?</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="selectUser('boy')" id="userBoy" 
                        class="user-btn border border-slate-700 bg-slate-950 hover:border-red-500 p-3 rounded-xl text-sm font-bold transition">
                        🙋‍♂️ ကောင်လေး (Boy)
                    </button>
                    <button type="button" onclick="selectUser('girl')" id="userGirl" 
                        class="user-btn border border-slate-700 bg-slate-950 hover:border-red-500 p-3 rounded-xl text-sm font-bold transition">
                        🙋‍♀️ ကောင်မလေး (Girl)
                    </button>
                </div>
            </div>

            <!-- AI Bestie Personality Selection -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-300">ဘယ်လို AI Bestie နဲ့ ရန်ဖြစ်ချင်လဲ?</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="selectAI('bro')" id="aiBro" 
                        class="ai-btn border border-slate-700 bg-slate-950 hover:border-red-500 p-3 rounded-xl text-sm font-bold transition">
                        😎 ဂျပိုးဘဲကြီး (Toxic Bro)
                    </button>
                    <button type="button" onclick="selectAI('sister')" id="aiSister" 
                        class="ai-btn border border-slate-700 bg-slate-950 hover:border-red-500 p-3 rounded-xl text-sm font-bold transition">
                        💅 ပါးစပ်ဆိုးတဲ့ မမကြီး (Toxic Bestie)
                    </button>
                </div>
            </div>

            <button onclick="startChat()" id="startBtn" disabled 
                class="w-full bg-slate-800 text-slate-500 py-3 rounded-xl font-bold text-sm transition cursor-not-allowed">
                စကားစပြောမယ် 🚀
            </button>
        </div>
    </div>

    <!-- 2. Main Chat Interface -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-lg">
        <div>
            <h1 class="text-base font-bold text-red-500 flex items-center gap-2">
                <span id="headerAiName">Toxic Bestie</span> 
                <span class="text-[10px] bg-red-950 text-red-300 px-2 py-0.5 rounded-full border border-red-800">Heartbreak Mode</span>
            </h1>
            <p id="headerSubtitle" class="text-[11px] text-slate-400">စကားပြောနေသည်...</p>
        </div>
        <button onclick="location.reload()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
            🔄 ပြန်ရွေးမည်
        </button>
    </header>

    <!-- Chat Messages Container -->
    <div id="chatContainer" class="chat-container flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <!-- Dynamic Welcome Message will be injected here -->
    </div>

    <!-- Typing Indicator -->
    <div id="typingIndicator" class="hidden px-4 py-2 max-w-2xl w-full mx-auto flex items-center gap-2 text-xs text-slate-400">
        <div class="bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold text-xs">AI</div>
        <span id="typingText">စကားလုံး ရှာနေသည်...</span>
    </div>

    <!-- Input Form -->
    <div class="bg-slate-900 border-t border-slate-800 p-3">
        <form id="chatForm" class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="မင်းရဲ့ ခံစားချက်ကို ရိုက်ထည့်လိုက်စမ်း..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500 placeholder-slate-500">
            <button type="submit" 
                class="bg-red-600 hover:bg-red-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition-all shadow-lg flex items-center justify-center">
                ပို့မည် 🚀
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let selectedUser = null;
        let selectedAI = null;

        function selectUser(type) {
            selectedUser = type;
            document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('border-red-500', 'bg-red-950/30'));
            document.getElementById(type === 'boy' ? 'userBoy' : 'userGirl').classList.add('border-red-500', 'bg-red-950/30');
            checkReady();
        }

        function selectAI(type) {
            selectedAI = type;
            document.querySelectorAll('.ai-btn').forEach(b => b.classList.remove('border-red-500', 'bg-red-950/30'));
            document.getElementById(type === 'bro' ? 'aiBro' : 'aiSister').classList.add('border-red-500', 'bg-red-950/30');
            checkReady();
        }

        function checkReady() {
            const btn = document.getElementById('startBtn');
            if (selectedUser && selectedAI) {
                btn.disabled = false;
                btn.classList.remove('bg-slate-800', 'text-slate-500', 'cursor-not-allowed');
                btn.classList.add('bg-red-600', 'hover:bg-red-700', 'text-white', 'cursor-pointer');
            }
        }

        function startChat() {
            document.getElementById('setupScreen').classList.add('hidden');
            
            // Set Header Names
            const aiNameEl = document.getElementById('headerAiName');
            aiNameEl.innerText = selectedAI === 'bro' ? '😎 ဂျပိုးဘဲကြီး (Toxic Bro)' : '💅 ပါးစပ်ဆိုးတဲ့ မမကြီး';

            // Initial greeting based on combinations
            let greeting = "";
            if (selectedAI === 'bro' && selectedUser === 'boy') {
                greeting = "ဟေ့ကောင်... ဘာလဲကွ၊ ရည်းစားက ထားသွားလို့ လာငိုပြမလို့လား? ယောကျာ်းချင်း တူတာပဲ ထမင်းသွားကျွေးမယ်၊ ထ! ငိုမနေနဲ့။ 🍺";
            } else if (selectedAI === 'bro' && selectedUser === 'girl') {
                greeting = "ဟင်... ညီမလေးရေ၊ အဲ့လောက်ထိ ဖြစ်ရအောင် သူ့မှာ ဘာတွေများ မိုက်လို့လဲကွ။ ကဲပါ... အင်္ကျီမျက်ရည်စ တောက်လိုက်တော့၊ ကိုယ့်ဘဲက အဲ့လောက်တန်ဖိုးမရှိဘူး။ 🥱";
            } else if (selectedAI === 'sister' && selectedUser === 'boy') {
                greeting = "သေနာကောင်... မင်းမျက်နှာနဲ့များ လမ်းခွဲခံရတာ မဆန်းပါဘူးလေ။ ရည်းစားဟောင်းကို လွမ်းနေမယ့်အစား မှန်ထဲမှာ သွားကြည့်ဦး၊ ဖုတ်ကောင်တောင် မင်းထက် လက်ပ်တော့သေးတယ်။ 💀";
            } else {
                greeting = "အဟား... စိတ်မကောင်းစရာပဲ ညီမလေးရေ၊ ဒါပေမဲ့ နင်ရွေးထားတဲ့ဘဲက စကတည်းက Red Flag မှန်း ငါပြောသားပဲကို။ ကဲ... ဘာတွေ ဖြစ်ကုန်ပြီလဲ အကုန်ပြောပြစမ်း။ ☕";
            }

            appendMessage(greeting, 'ai');
        }

        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            userInput.value = '';

            typingIndicator.classList.remove('hidden');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                typingIndicator.classList.add('hidden');
                const reply = getToxicReply(message);
                appendMessage(reply, 'ai');
            }, 1200);
        });

        function getToxicReply(msg) {
            const repliesByCombo = {
                'bro-boy': [
                    "ဟားဟား... ရည်းစားဟောင်းကို သွားတမ်းတမနေနဲ့ကွာ။ ဟိုဘက်ကောင်က နင့်ထက် ပိုချောလို့လား၊ ပိုက်ဆံပိုရှိလို့လား? နှစ်ခုလုံးမဟုတ်ရင် မင်းကံဆိုးတာပဲ၊ ထ မာလာရှမ်းကောင် သွားစားမယ်။",
                    "ယောကျာ်းပီပီ ရဲရဲရင်ဆိုင်စမ်း။ ငိုနေလို့ အဲ့ဒီပိတောက်ပင်က ပြန်လာမှာမဟုတ်ဘူး။ အလုပ်လုပ်ပြီး ပိုက်ဆံရှာတာကမှ ကုသိုလ်ရသေးတယ်။",
                    "ငါ့လူရියා... အသည်းကွဲတာက မသေလောက်ပါဘူးကွာ။ ဒါပေမဲ့ မင်းအခြေအနေက ကြည့်ရတာ နောက်ထပ် ၃ နှစ်လောက် တစ်ယောက်ထဲနေရမယ့်ကိန်း ရှိတယ်။"
                ],
                'bro-girl': [
                    "ညီမလေးရယ်... အဲ့ဒီလူက နင့်ကို တန်ဖိုးမထားတာ မင်းအမှားမဟုတ်ပါဘူး။ သူ့ရဲ့ မိုက်မဲမှုပါပဲ။ ကဲ... ဇာတ်လမ်းကြော ရပ်လိုက်တော့နော်၊ အိပ်ရာဝင်ချိန်ရောက်ပြီ။",
                    "အသည်းကွဲရင် ထမင်းဝအောင်စား၊ ရေခဲမုန့်သုံးဘူးထိုင်ချ။ မျက်ရည်ကျတာက ကော်ဂျင်ဆန်း ပျက်စီးတာပဲ အဖတ်တင်တယ်။",
                    "အဲ့ဒီကောင်ကို မေ့လိုက်တော့။ ငါနဲ့ လမ်းလျှောက်ထွက်မယ်, ဟော့ပေါ့သွားစားမယ်၊ ပြီးရင် ညဘက် ကောင်းကောင်းအိပ်။"
                ],
                'sister-boy': [
                    "သေနာကောင်... မင်းပုံစံနဲ့များ ရည်းစားရသေးတာကိုက အံ့သြစရာကြီး။ အခုတော့ ငိုပြမနေနဲ့၊ ကိုယ့်အမှားကိုယ် ပြန်ဆန်းစစ်။",
                    "အော်... နှမြောလိုက်တာ ရည်းစားဟောင်းလေး။ မင်းလို ပေါက်ကရကောင်နဲ့ တွဲမိတာ သူတောင် ကံဆိုးတယ်။ လာမငိုနဲ့၊ ဟိုတယ်ဘောက်ချာတော့ မရှိဘူး ဟင်းပဲစားရမယ်။",
                    "တော်စမ်းပါဦး... မင်းအသည်းကွဲတာ ငါ့ခေါင်းကို လာကိုက်နေတယ်။ သွား၊ မျက်နှာသစ်ပြီး ကျောင်းသွား သို့မဟုတ် အလုပ်လုပ်စမ်း။"
                ],
                'sister-girl': [
                    "နင်တို့နှစ်ယောက်ကတော့လေ... စစချင်းကတည်းက ငါပြောသားပဲ Red Flag လို့။ အခုမှ မျက်ရည်ကျပြမနေနဲ့။",
                    "အမေရိကန်ဒေါ်လာတောင် တန်ဖိုးကျတယ်၊ အဲ့ဒီဘဲက ဘာမို့လို့လဲ ညီမလေးရယ်။ ထ, ရေချိုး, ရုပ်ပြင်, ပြီးရင် Shopping ထွက်မယ်။",
                    "ဟားဟား ရယ်ရတယ်။ နင်ကလည်း တကယ်ကို အချစ်စုန်းပြူးပဲ။ အခုတော့ AI ဖြစ်တဲ့ ငါ့ကိုလာငိုပြနေတာနဲ့ ဘဲက ပြန်ရောက်လာမှာမဟုတ်ဘူးသိလား။"
                ]
            };

            const key = `${selectedAI}-${selectedUser}`;
            const list = repliesByCombo[key] || repliesByCombo['bro-boy'];
            return list[Math.floor(Math.random() * list.length)];
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            if (sender === 'user') {
                messageDiv.className = 'flex items-start justify-end gap-3';
                messageDiv.innerHTML = `
                    <div class="bg-red-600 text-white p-3.5 rounded-2xl rounded-tr-none max-w-[80%] text-sm shadow">
                        ${escapeHTML(text)}
                    </div>
                    <div class="bg-slate-700 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0">မင်း</div>
                `;
            } else {
                messageDiv.className = 'flex items-start gap-3';
                messageDiv.innerHTML = `
                    <div class="bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
                    <div class="bg-slate-800 border border-slate-700 text-slate-100 p-3.5 rounded-2xl rounded-tl-none max-w-[80%] text-sm shadow">
                        ${escapeHTML(text)}
                    </div>
                `;
            }
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '#'+'39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
