<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toxic Bestie AI - Live Gemini Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pyidaungsu', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 h-screen flex flex-col justify-between">

    <!-- 1. Setup Screen -->
    <div id="setupScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-5 my-auto">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-red-500 mb-1">🔥 Toxic Bestie AI</h1>
                <p class="text-xs text-slate-400">Gemini AI စွမ်းရည်ဖြင့် အသည်းကွဲသူများကို လာစမည့်စနစ်</p>
            </div>

            <!-- Gemini API Key Input -->
            <div class="space-y-1">
                <label class="text-xs font-bold text-red-400">Google AI Studio API Key ထည့်ရန်:</label>
                <input type="text" id="apiKeyInput" placeholder="AIzaSy..." 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
                <p class="text-[10px] text-slate-500">Google AI Studio (aistudio.google.com) မှ ရယူထားသော API Key ကို ထည့်ပါ။</p>
            </div>

            <!-- User Gender Selection -->
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-300">မင်းက ဘယ်သူလဲ?</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="selectUser('boy')" id="userBoy" 
                        class="user-btn border border-slate-700 bg-slate-950 hover:border-red-500 p-2.5 rounded-xl text-xs font-bold transition">
                        🙋‍♂️ ကောင်လေး (Boy)
                    </button>
                    <button type="button" onclick="selectUser('girl')" id="userGirl" 
                        class="user-btn border border-slate-700 bg-slate-950 hover:border-red-500 p-2.5 rounded-xl text-xs font-bold transition">
                        🙋‍♀️ ကောင်မလေး (Girl)
                    </button>
                </div>
            </div>

            <!-- AI Bestie Personality Selection -->
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-300">ဘယ်လို AI Bestie နဲ့ ရန်ဖြစ်ချင်လဲ?</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="selectAI('bro')" id="aiBro" 
                        class="ai-btn border border-slate-700 bg-slate-950 hover:border-red-500 p-2.5 rounded-xl text-xs font-bold transition">
                        😎 ဂျပိုးဘဲကြီး (Toxic Bro)
                    </button>
                    <button type="button" onclick="selectAI('sister')" id="aiSister" 
                        class="ai-btn border border-slate-700 bg-slate-950 hover:border-red-500 p-2.5 rounded-xl text-xs font-bold transition">
                        💅 ပါးစပ်ဆိုးတဲ့ မမကြီး (Toxic Bestie)
                    </button>
                </div>
            </div>

            <button onclick="startChat()" id="startBtn" disabled 
                class="w-full bg-slate-800 text-slate-500 py-3 rounded-xl font-bold text-xs transition cursor-not-allowed">
                စကားစပြောမယ် 🚀
            </button>
        </div>
    </div>

    <!-- 2. Main Chat Interface -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-lg">
        <div>
            <h1 class="text-base font-bold text-red-500 flex items-center gap-2">
                <span id="headerAiName">Toxic Bestie</span> 
                <span class="text-[10px] bg-red-950 text-red-300 px-2 py-0.5 rounded-full border border-red-800">Live AI</span>
            </h1>
            <p id="headerSubtitle" class="text-[11px] text-slate-400">စကားပြောနေသည်...</p>
        </div>
        <button onclick="location.reload()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
            🔄 ပြန်ရွေးမည်
        </button>
    </header>

    <!-- Chat Messages Container -->
    <div id="chatContainer" class="chat-container flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto"></div>

    <!-- Typing Indicator -->
    <div id="typingIndicator" class="hidden px-4 py-2 max-w-2xl w-full mx-auto flex items-center gap-2 text-xs text-slate-400">
        <div class="bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold text-xs">AI</div>
        <span>AI စာစဉ်နေသည်...</span>
    </div>

    <!-- Input Form -->
    <div class="bg-slate-900 border-t border-slate-800 p-3">
        <form id="chatForm" class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="မင်းရဲ့ ခံစားချက်ကို ရိုက်ထည့်လိုက်စမ်း..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500 placeholder-slate-500">
            <button type="submit" 
                class="bg-red-600 hover:bg-red-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition-all shadow-lg flex items-center justify-center">
                ပို့မည် 🚀
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let selectedUser = null;
        let selectedAI = null;
        let apiKey = "";
        let chatHistory = [];

        function selectUser(type) {
            selectedUser = type;
            document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('border-red-500', 'bg-red-950/30'));
            document.getElementById(type === 'boy' ? 'userBoy' : 'userGirl').classList.add('border-red-500', 'bg-red-950/30');
            checkReady();
        }

        function selectAI(type) {
            selectedAI = type;
            document.querySelectorAll('.ai-btn').forEach(b => b.classList.remove('border-red-500', 'bg-red-950/30'));
            document.getElementById(type === 'bro' ? 'aiBro' : 'aiSister').classList.add('border-red-500', 'bg-red-950/30');
            checkReady();
        }

        function checkReady() {
            const btn = document.getElementById('startBtn');
            const keyInput = document.getElementById('apiKeyInput').value.trim();
            if (selectedUser && selectedAI && keyInput.length > 10) {
                btn.disabled = false;
                btn.classList.remove('bg-slate-800', 'text-slate-500', 'cursor-not-allowed');
                btn.classList.add('bg-red-600', 'hover:bg-red-700', 'text-white', 'cursor-pointer');
            }
        }

        document.getElementById('apiKeyInput').addEventListener('input', checkReady);

        async function startChat() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            document.getElementById('setupScreen').classList.add('hidden');
            
            const aiNameEl = document.getElementById('headerAiName');
            aiNameEl.innerText = selectedAI === 'bro' ? '😎 ဂျပိုးဘဲကြီး' : '💅 ပါးစပ်ဆိုးတဲ့ မမကြီး';

            let initialPrompt = "မင်းက မြန်မာလူငယ်ဆန်ဆန် ခပ်ပြောင်ပြောင်၊ ခပ်ကြမ်းကြမ်း ဟာသလုပ်ပြီး ဆဲဆိုစနောက်တတ်တဲ့ Toxic Bestie AI ပါ။ အသုံးပြုသူက အသည်းကွဲလို့ လာငိုပြတဲ့အခါ ပထမဆုံး နှုတ်ဆက်စာ အတိုဆုံးနဲ့ ခပ်စပ်စပ် စတင်ရေးပေးပါ။";
            
            appendMessage("AI စဉ်းစားနေသည်...", 'ai', true);
            const greeting = await callGeminiAPI(initialPrompt);
            document.getElementById('chatContainer').lastChild.remove();
            appendMessage(greeting, 'ai');
        }

        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            userInput.value = '';

            typingIndicator.classList.remove('hidden');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiReply = await callGeminiAPI(message);
            
            typingIndicator.classList.add('hidden');
            appendMessage(aiReply, 'ai');
        });

        async function callGeminiAPI(userText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            chatHistory.push({
                role: "user",
                parts: [{ text: userText }]
            });

            const body = {
                contents: chatHistory
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const data = await response.json();
                
                if (data.error) {
                    return `⚠️ API Error: ${data.error.message || 'Key မှားနေပါသည် သို့မဟုတ် ခွင့်ပြုချက်မရှိပါ။'}`;
                }

                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatHistory.push({
                        role: "model",
                        parts: [{ text: reply }]
                    });
                    return reply;
                } else {
                    return "ဟဲ့... အလုပ်မလုပ်တော့ဘူး၊ API Key သို့မဟုတ် ကွန်ရက် ပြန်စစ်စမ်း။ 😒";
                }
            } catch (err) {
                console.error(err);
                return "ဖမ်းလို့မမိဘူး၊ ကွန်ရက် ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေတယ်။ 😤";
            }
        }

        function appendMessage(text, sender, isLoading = false) {
            const messageDiv = document.createElement('div');
            if (sender === 'user') {
                messageDiv.className = 'flex items-start justify-end gap-3';
                messageDiv.innerHTML = `
                    <div class="bg-red-600 text-white p-3.5 rounded-2xl rounded-tr-none max-w-[80%] text-sm shadow">
                        ${escapeHTML(text)}
                    </div>
                    <div class="bg-slate-700 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0">မင်း</div>
                `;
            } else {
                messageDiv.className = 'flex items-start gap-3';
                messageDiv.innerHTML = `
                    <div class="bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
                    <div class="bg-slate-800 border border-slate-700 text-slate-100 p-3.5 rounded-2xl rounded-tl-none max-w-[80%] text-sm shadow ${isLoading ? 'animate-pulse text-slate-400' : ''}">
                        ${escapeHTML(text)}
                    </div>
                `;
            }
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
